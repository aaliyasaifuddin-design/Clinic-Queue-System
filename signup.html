
<!DOCTYPE html>
<html>
<head>
    <title>Doctor Sign Up</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Doctor Registration</h1>

    <div class="container">
        <h2>Create your Doctor Account</h2>

        <form action="/signup" method="POST">
            <label>Doctor Name:</label>
            <input type="text" name="doctor_name"
       placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" name="email"
       placeholder="Enter your email" required>

            
<label>Password:</label>

<div class="password-wrapper">
    <input
        type="password"
        name="password"
        id="signupPassword"
        placeholder="Enter your password"
        minlength="8"
        required
    >

    <button
        type="button"
        class="password-toggle"
        onclick="toggleSignupPassword()"
        aria-label="Show password"
    >
        <svg id="signupEyeIcon" xmlns="http://www.w3.org/2000/svg"
             width="22" height="22" viewBox="0 0 24 24"
             fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </button>
</div>

<script>
function toggleSignupPassword() {
    const password = document.getElementById("signupPassword");
    const button = document.querySelector(".password-toggle");
    const icon = document.getElementById("signupEyeIcon");

    if (password.type === "password") {
        password.type = "text";
        button.setAttribute("aria-label", "Hide password");
        icon.innerHTML = `
            <path d="M3 3l18 18"/>
            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
            <path d="M9.9 5.2A11 11 0 0 1 12 5
                     c6.5 0 10 7 10 7a15 15 0 0 1-3 3.8"/>
            <path d="M6.6 6.6C3.6 8.4 2 12 2 12
                     s3.5 7 10 7a10 10 0 0 0 4-.8"/>
        `;
    } else {
        password.type = "password";
        button.setAttribute("aria-label", "Show password");
        icon.innerHTML = `
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
        `;
    }
}
</script>


            <button type="submit">Create Account</button>
        </form>

        
<p>Register your account to manage your clinic.</p>

<p>
    Already have an account?
    <a href="{{ url_for('login') }}">Login Here</a>
</p>

    </div>
</body>
</html>
