
<!DOCTYPE html>
<html>
<head>
    <title>Register Your Clinic</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Register Your Clinic</h1>

    <div class="container">
        <h2>Enter Clinic Detail</h2>

        <form action="/register-clinic" method="POST">
            <label>Clinic Name:</label>
            <input type="text" name="clinic_name" required>

            <label>City:</label>
            <input type="text" name="city" required>

            <label>Clinic Address:</label>
            <input type="text" name="address" required>

            <button type="submit">Register Clinic</button>
        </form>
    </div>
</body>
</html>
